            - text: ", 2018-07-04"
            - text: "@BigWings Ironically, I'd had this discussion behind the scenes years ago, and took the additional step out, but completely forgot to update the early shaders where I'd initially posed the question. Amazing that it's sat there for years unnoticed. I'll comment the line out. In fact, I'll take it all out to avoid confusion. You'll note that in examples I've written since, I don't take that step. One thing that I tend to implement to alleviate popping is checking for the absolute distance, just in case the ray traverses too far into the surface... It doesn't always work, but you'd be amazed at how often it helps. Another thing to note is the high surface hit threshold of \".005.\" I used to raymarch stuff before this site went up -- when computers were still pretty slow, so a common threshold today -- like \".001\" -- that required more iterations was considered a luxury. It needs to be lowered, but I might leave it there for posterity. In fact, this example needs a revamp. I might put together a more polished trapezoidal noise version."
            - img [ref=e450]
