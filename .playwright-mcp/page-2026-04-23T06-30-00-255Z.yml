            - text: ", 2018-07-04"
            - text: "@chrisjj I use a distance related threshold more often than not these days. Although, I usually go for something cheap and subtle with a range. \"if(abs(d)<.001*(t*.125 + 1.) || t>FAR) break;\" -- I use that one a lot when I need to cover a bit of distance, since you can often get away with less precision with more distant objects. The code here is reasonably sound, but it was based on routines I'd written long before posting the example on Shadertoy -- Back when GPUs were slow, which meant taking shortcuts that you wouldn't take today. I usually try to make a note of it in the comments. Either way, I've been meaning to post a cleaner, more up-to-date version of this, so I'll put it on my list of things to do."
