            - link "Shane" [ref=e497] [cursor=pointer]:
              - /url: /user/Shane
            - text: ", 2016-03-28"
            - text: "@Barteks2x I prefer the rounded one myself. I can't remember why I went with the boxed version. Probably, just for something different. @Cubed Essentially, the process involves nothing more than moving a camera along a path \"vec3(path(time), time)\" through a curvy tube with distance function \"R - length(p.xy - path(p.z)).\" The noisy surface deformation is an added extra. In general, you can do this with more sophisticated objects than a simple tube. I have a winding Menger tunnel example that uses the same premise."
