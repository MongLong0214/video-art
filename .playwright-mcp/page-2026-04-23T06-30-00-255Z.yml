          - generic [ref=e410]:
            - link "Shane" [ref=e411] [cursor=pointer]:
              - /url: /user/Shane
            - text: ", 2025-05-03"
            - text: "@TheArchCoder This was written when GPUs were really picky about how many operations were placed inside the raymarching loop. Therefore, we were constantly on the lookout for simple routines with small overhead that would result in interesting visuals. Camera work and winding tunnels were an oldschool staple, since they were fun to watch and cheap, and the triangle noise (Nimitz's creation, as far as I know) isn't reliant on grids and hash functions, so is ideal for realtime creation. Of course, pre-calculation can lead to way more interesting things, but it's not always available, nor is it always simple in shader form. I miss that days when GPUs forced us to use minimal instructions, but there's always pressure to move with the times. I miss the days when I had more coding energy too."
            - img [ref=e412]
