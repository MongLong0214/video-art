            - link "FabriceNeyret2" [ref=e578] [cursor=pointer]:
              - /url: /user/FabriceNeyret2
            - text: ", 2021-02-20"
            - text: "@iq: 1.2x faster [by] preventing loop unrolling How strange ! is it true on OpenGL too ? Very strange, preventing unrolling generally slow things, and for good reasons. Code cache: I once add to an Nvidia tech, and it seems almost impossible to fail the code cache (of course, but with dedicated code, plus these guys don't always know how extreme our shaders are :-D ). Now, for the optimizer there seem to be windowed range, so who knows in this case. But first, I'm curious whether the gain is in the same direction in OpenGL vs Windows, or Nvidia vs else. Also, the recent Vulkan-based compilers react very differently (sometime worse perfs, sometime better). Detail: for the first minute or so the perfs oscillate really a lot, before stabilising at 8.6 fps at 640x360."
        - generic [ref=e579]:
