            - text: Soon they'll come up with the idea of letting the model share vertices that are sufficiently close to each other. It's also a matter of time before they think of splats/triangles having a learnable "texture" (a Gabor or other) to capture high frequency detail without exploding the number of splats/triangles. It's fascinating to see them slowly go through it all, again.
