            - link "ollj" [ref=e788] [cursor=pointer]:
              - /url: /user/ollj
            - text: ", 2017-11-08"
            - text: i think a [foggy valley] would look good (as in, easily believable and high geometry detail) and have good performance, even when valleys are seeded noise. Fog in valleys basically replaces the occlusion that a mountain would have there otherwise. most people do distance fog poorly, by making it spherical around the camera, and not making it diminishing fog with increasing height. google image search [fog valley] for inspiration. most photos look down into valleys, because looking out of a fog is just not as characteristic. diminishing fog by height (volume marching a cloud in a valley) makes it easy to look "up" from inside a foggy valley, so you likely see birds and nearby mountain peaks. This mostly diminishes looking nearly-horizontally along or trough a foggy valley. Then you put all your high detail geometry inside a foggy valley (along rivers), where it is more realistically occluded by fog and surrounded by either mountains or more valley-fog. you can fly into valleys and over them, giving the illusion of more detail than there is per frame, from memory of what you saw there.
