        - generic [ref=e348]:
          - img [ref=e350]
          - generic [ref=e351]:
            - link "iq" [ref=e352] [cursor=pointer]:
              - /url: /user/iq
            - text: ", 2023-11-26"
            - text: "To prevent overshooting you need to divide your step size to the maximum derivative of the function (the slope of the terrain) in the neighborhood of the area you are sampling. You can do this properly, or just hack it a bit like I am doing here in line 557: First I consider the terrain without the cliffs, and I set a raymarching step multiplier of 0.8, which allows me to raymarch terrains of a maximum slope of 51 degrees (atan(1/0.8)), which is sufficient for this terrain. Then I need to consider the cliffs, and in this case I do not take their slope, but instead simply apply an extra slow down when we are in the neighborhood of a cliff. I extract this information as a mask (0 to 1), from the terrain building function itself, which I pass to the raymarcher in the env.y, variable."
        - generic [ref=e353]:
          - img [ref=e355]
          - generic [ref=e356]:
            - link "ollj" [ref=e357] [cursor=pointer]:
              - /url: /user/ollj
            - text: ", 2023-11-26"
            - text: solving for the overshooting of .y heightmaps has fundamentally the same issues of QUICKLY finding a local minimum of f(xy), and most methods for this involve dividing by a lot of first derivatives.
