            - link "Gaktan" [ref=e533] [cursor=pointer]:
              - /url: /user/Gaktan
            - text: ", 2021-05-06"
            - text: "@iq I checked the difference of loop unrolling using a certain vendor shader compiler software 1. The shader is 43028 bytes with loop unrolling, but only 20120 bytes when forcing loops. Having bigger size is terrible, because it actually causes a lot of cache thrashing 2. LDS is used with loop unrolling. Not sure why it's used, but using it will introduce some waits when multiple threads access the same LDS. 3. Looks like forcing a loop increases the scalar ALU, so maybe some operator become scalar instead of vector? Very hard to say for sure though. unroll: Scalar ALU: 318 Vector ALU: 7363 force loop: Scalar ALU: 327 Vector ALU: 3223 I think the biggest win is the binary code size, which makes sense."
