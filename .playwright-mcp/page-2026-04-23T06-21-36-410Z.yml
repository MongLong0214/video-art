              - /url: /user/ollj
            - text: ", 2023-11-26"
            - text: "you under-step by marching only half or quarter distance each step, and then you may need much more steps. Hopefully you add other smart things, like not caring for precision further away from the camera, to compensate for the under-stepping. This compensation may be done by a logarithmic precision of log(distanceToSurface/distanceFromCamera) :: let s=distanceToSurface AND c=DistanceToCamera :: if(s<0.01) //is a simple arbitrary distance precision. may be changed to if log(c*c/s/100000.)>0.0 or if log(c*c/s/s/1000000.)>0.5 or if log(c*c*c/s/s/100000000000.)>0.0 as in logeps() of https://www.shadertoy.com/view/tdXXzl Where the things that divide by larger numbers are better for larger distanceFields (seeing a moon at a horizon from a planet surface), and the shorter ones are better for smaller distanceFields. of courrse the precision must also be scaled to the scaling of the distanceField, which is much trickier in log() scales. logeps() tends to do just fine with 1000* as many raymarch iterations, plenty of space to understep more, because most rays overtep far away from the camera and they need a lot less less iterations that way, and only near-tangential/horizon cases need more steps. You could also estimate the local 3d derivative each step, and hope that diving by that differential will significantly/mostly normalize a skewed lipschits-constant, but so far this has never been worth it. you could also use the same derivative, to to other silly things, that have not been worth it, like https://www.shadertoy.com/view/WdfSD2, which may perform better for near-parallel-horizon cases."
