          - generic [ref=e275]:
            - link "iq" [ref=e276] [cursor=pointer]:
              - /url: /user/iq
            - text: ", 2025-07-03"
            - text: I see gaussian splatting as a rebrand of the old school point cloud renderers of the early 2000s, only with an optimization pass to them instead of just raw scanning (traditional pointclouds) or generation from sampling a mesh (surfels). The ML folks will soon rediscover photogrammetry, then regular polygon modeling; and we'll be full circle all over again (third of forth loop).
        - generic [ref=e277]:
          - img [ref=e279]
          - generic [ref=e280]:
            - link "FabriceNeyret2" [ref=e281] [cursor=pointer]:
              - /url: /user/FabriceNeyret2
            - text: ", 2025-07-03"
            - text: "Gaussian splatting would more be like bombing methods (or even Gabor noise): building complex fields by combination of many small simples ones. By the way, RBF (radial basis function and SPH (smooth particles hydrodynamics) has been around for long ;-) Here is is totally different: you have isolated ellipsoids forming kind of base shape or bounding, that is then carved with noise. Much like pretty old Perlin Hypertextures or even Reeves trees made from particle systems clamped into ellipsoids or cones."
