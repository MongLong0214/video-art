          - generic [ref=e207]:
            - generic [ref=e208]: "9"
            - text: //parabola.
          - generic [ref=e209]:
            - generic [ref=e210]: "10"
            - text: //
          - generic [ref=e211]:
            - generic [ref=e212]: "11"
            - text: //to get the distance from p to the sine curve, we first do
