          - generic [ref=e219]:
            - generic [ref=e220]: "15"
            - text: //call this point "q". we undo the mapping we made to p with
          - generic [ref=e221]:
            - generic [ref=e222]: "16"
            - text: //q.x = asin(q.x*frequency)/frequency
          - generic [ref=e223]:
            - generic [ref=e224]: "17"
            - text: //we do need to clamp it between -1 and 1 before passing into asin
          - generic [ref=e225]:
            - generic [ref=e226]: "18"
            - text: //but that is the gist of the method.
          - generic [ref=e227]:
            - generic [ref=e228]: "19"
            - text: //
          - generic [ref=e229]:
            - generic [ref=e230]: "20"
            - text: //this estimate only works for one half of the principal half cycle,
          - generic [ref=e231]:
            - generic [ref=e232]: "21"
