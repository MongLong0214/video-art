            - link "lahwran" [ref=e462] [cursor=pointer]:
              - /url: /user/lahwran
            - text: ", 2021-02-09"
            - text: "also it's worth noting: using operations typically used in handwritten SDFs as the activation operations in neural SDFs should allow the neural SDFs to in many cases exactly recover the behavior of the handwritten SDF. if you can't even in principle find weights that exactly recover a handwritten SDF with at most a similar number of operations in the network, then you haven't found a network representation that properly describes the space of possible SDFs."
        - generic [ref=e463]:
          - img [ref=e465]
          - generic [ref=e466]:
            - link "lahwran" [ref=e467] [cursor=pointer]:
              - /url: /user/lahwran
            - text: ", 2021-02-09"
            - text: "hello have a braindump I hope this enriches your life because I really should be doing something else right now. so it doesn't seem like this network is likely to be using its weights very efficiently. I haven't done the detailed investigation to know this for sure - to do that, I'd do visualizations of the output volumes of each layer of the network, to see what the intermediate representations are - but the big tell is those high freqency artifacts on the surface of the bunny, if it was using its low frequency features ideally it wouldn't need those high frequency ones. https://arxiv.org/pdf/2006.10739.pdf it might be interesting to try a network like this, one where the sinusoidal is on the input rather than as an activation function. that allows regularizing the number of sinusoidal inputs you need: for the first layer, initially start too wide, eg 16 or 32 or even more fourier features, and use model compression style regularization to set input connections to zero - l1+fading-in soft-l0, no l2, sample n nonzero weights per output column on the input matrix each training example - outputting to an 8-wide output. that gives you input feature selection. then, feed that through some number of 4x4 mults to a few different activation functions. might also be worth looking at trying multi-bias. at least one of the activation functions should probably be something smooth like sigmoid or tanh or smoothstep or something else that provides additional smoothness in the mid layers, also probably pow(relu(x), 2.) or something would help with distance calculation. in other words - use operations that have a similar shape to what is typically used in shaders (just a few branches and distance calculations), and evaluate it in a space that allows it to select its position representation. that should allow compressing more. if you really want to spend compute on it, one could try automl, I'm not up to date on what options there are for serious automl for tiny networks like this but the full-space output supervision means there's a good shot at evolving an efficient network. Then, once you have that working, you could then train a network like this for every pose of a model and initially give it massively overcomplete input representation of concat(fourier_features(model_pose_state), fourier_features(3dnearest_2d_texel_pos), fourier_features(model_space_xyz)) and use the initial regularized matrix to feature-select out of those, and then evaluate it in screenspace to sdf-trace through a higher resolution version of the model in the implicit space of the neural network. If done right this should allow combining an actual mesh model and texture with a neural SDF upsampler, thereby allowing faking much higher resolution detail than a texture bumpmap otherwise allows. though, maybe you'd need to tell it the relative position in a texel, and feed it one texel to give it information on what kind of upsampling to do in that texel. or maybe you'd need to give it the four adjacent texels as input and have it figure out if it needs to use them? it also really depends on your final compute budget, but my hope is that this allows compressing models enough to render them on lower end devices, which means using a low res texture and the tiniest model manageable. if you're instead going to use a high res texture, then an option might be to use entirely different weights in different regions of the texture, thereby completely replacing the concept of bump map textures."
