            - text: can I get a mathematical basis specifically for that tetrahedral gradient sampling pattern?
        - generic [ref=e349]:
          - img [ref=e351]
          - generic [ref=e352]:
            - link "ollj" [ref=e353] [cursor=pointer]:
              - /url: /user/ollj
            - text: ", 2023-08-27"
            - text: "https://iquilezles.org/articles/normalsSDF/ mathematically iaa finite-difference-estimate https://en.wikipedia.org/wiki/Finite_difference#Relation_with_derivatives also shortly described here: https://computergraphics.stackexchange.com/questions/8093/how-to-compute-normal-of-surface-from-implicit-equation-for-ray-marching naive variants tap 6 times, simple ones tap 3 times+center (center-point has already been measured). This one taps 4 OFFSET-TETRAHEDRAL points instead (that still average out tho the same center), because using the central point will likely be too close to the surface, and useless in terms of precision (it will be a very small value/vector, to be added to significantly larger values/vectors, which is a waste of time in 32 bit precision or less)."
        - generic [ref=e354]:
          - img [ref=e356]
          - generic [ref=e357]:
            - link "ollj" [ref=e358] [cursor=pointer]:
              - /url: /user/ollj
            - text: ", 2023-08-27"
            - text: "raymarching gives you point-distances-to-surface, but the process is not very precise in many cases. we need a surface NORMAL for various visual effects, and there are many ways to get them. - automatic differentiation (general or specific-to-shape-function) returns analytic normal (first derivative over all domains) - a function may also return the closest-point-on-the-surface cheaply, and that gives you a decent normal-vector from any point. - there are 3 different quick estimate-methods by multy-tapping (in 3 patterns): and the most common taps 4 (offset) points (to a point very close to the surface) for their distance2-surface . and this generates 3 axis-aligned normal-vector-parts, to compose them into a 3d normal-vector, that is a good enough lazy estimation, that uses already defined functions as subroutines. the issue here is that the epsilon-distance (scalar of the normal vector) is arbitrary (gets normalized anyways, but precision-ideally should be close to a length of 1 before mornamize(), BUT instead is as-short-as-possible to not lose local surface-detail, so you lose precision from normalizing a short vector here."
