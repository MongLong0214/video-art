          - generic [ref=e489]:
            - link "iq" [ref=e490] [cursor=pointer]:
              - /url: /user/iq
            - text: ", 2021-01-21"
            - text: I've had 3 Shaders of the Week in the last 2 and a half years. That's close to one shader a year on average. That's feel far from your claim "All of them seem to be his". If you look all the way to 8 years back, a lot of shaders were mine and of a small group of users since the community was way smaller then and the random Shader picker had more chances to pick up one of ours, naturally. I guess what is misleading you is the fact that the "Shader of the Week" is not "Shader of this Week", meaning, it's not the best shader of the current week. Instead, "Shader of the Week" is a shader (selected from Shadertoy's history - 8 years at the moment) that represents the website for a whole week. Basically, having had the most impressive shader on a given week doesn't mean you get priority over the other hundreds of shaders.
