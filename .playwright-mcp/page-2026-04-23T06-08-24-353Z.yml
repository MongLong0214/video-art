            - text: ", 2021-03-16"
            - text: length(a)~=sqrt(dot(a,a)) for any a !=NaN length(a)==1.0/inversesqrt(dot(a,a)) for any a !=NaN ; length(0)==0 where ever normalized quaternions/vectors are used intelligently, you expect the quaternion/vector to lose a little bit of precision, after every ROTATION, but not change its length much. lets assume an initial quaternion/vector of length(a)=1, which is a reasonable default form. to increase quaternion/vector precision, you want to normalize() the quaternion/vector roughly every 4 rotations, BUT you do not need to normalize(a)==a/length(a), because length(a)=1 is asserted to be (and stay) VERY close to 1. Because of this assertion, repeated quaternion/vector "normalization" (of an already normalized vector), for the sole purpose of avoiding cumulative precision loss, simplifies to normalizeQuaternion(a)==a/dot(a,a), but only if length(a)~=1
