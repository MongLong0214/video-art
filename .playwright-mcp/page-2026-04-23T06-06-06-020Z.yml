          - generic [ref=e401]:
            - link "derSchamane" [ref=e402] [cursor=pointer]:
              - /url: /user/derSchamane
            - text: ", 2022-12-06"
            - text: I think CEVs/OEVs are a bit like magic, sometimes reproducable. Thus, a shader which produces a complex image out of seemingly nothing, is magic for me too. Therefore, these fields are quite close to each other, but the communication about this connection(perhaps due to legal circumstances and socialization?) is mostly hidden. For my experience the fact, that I can reproduce "psychonautical" visuals with mathematics, is mindblowing. So maybe different psychedelic experiences can reveal a human cognition the underliying mathematical structure of the universe in which we live in. So I agree, it's still worth watching and learning from. Mh, I never explicitly tried astral projection, but have been researching lucid dreaming for a number of years and had sometimes out of body experiences close to the descriptions of APs. I'm looking forward to your AP-Shader
            - img [ref=e403]
        - generic [ref=e404]:
          - img [ref=e406]
          - generic [ref=e407]:
            - link "derSchamane" [ref=e408] [cursor=pointer]:
              - /url: /user/derSchamane
            - text: ", 2022-12-04"
            - text: jep, I think in NY there is a church where they use it. Crazy to think about how they "work" with the substance in practice and also legally. My research with this substance showed me a kind of soft geometric dark and colored light pattern, fractal in its nature and slowly moving and evolving. There was some anxiety involved, I agree. But in the end, I don't have high-dose experiences with just the substance itself. But it's interestingt, that this molecule is orally active (without a MAOI)... To me, acid is a bit more geometric and brighter than this one and has six axes of symmetry instead of eight. One day I will try to code it. But right, this one is really close =)
