            - text: ", 2021-01-25"
            - text: I fixed the article. Sorry for that!
        - generic [ref=e407]:
          - img [ref=e409]
          - generic [ref=e410]:
            - link "KiO" [ref=e411] [cursor=pointer]:
              - /url: /user/KiO
            - text: ", 2021-01-23"
            - text: "Thank you to iq for all the amazing tutorials about raymarching. However, for those who came here from http://www.iquilezles.org/www/articles/menger/menger.htm, please be aware that there is currently a mistake in one of the implementations of this sponge, prior to optimisations. Current code is: vec3 map( in vec3 p ) { float d = sdBox(p,vec3(1.0)); float s = 1.0; for( int m=0; m<3; m++ ) { vec3 a = mod( p*s, 2.0 )-1.0; s *= 3.0; vec3 r = 1.0 - 3.0*abs(a); float c = sdCross(r)/s; d = max(d,-c); } return vec3(d,0.0,0.0); } Note that the last line in the loop has to read d = max(d,c), without the minus. Otherwise it does not work. I will never get these two hours of my life back, but I am sure all the hair I tore out will eventually grow again... I have no clue what is happening with all the mods and abs still, but that is a different story."
        - generic [ref=e412]:
