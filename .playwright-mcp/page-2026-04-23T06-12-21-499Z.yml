            - text: "Hello, I'm just be confused for several hours on that magic math around those lines: a = mod(p * s, 2.0) - 1.0; r = abs(1.0 - 3.0 * abs(a)) It might be some wrong with my brain, but for me it is really hard to figure out what was going on. I think the following calculation is much more clear for me: a = mod( (p + 1) * s, 2.0 ) - 1.0; r = abs(3.0 * a); and replace c by -c (c = -(min(...) / s)). Although they are equal (at least visually, I have not checked it), I think the second one is more easier to understand... ( for me lol Thanks for those brilliant works! xD"
