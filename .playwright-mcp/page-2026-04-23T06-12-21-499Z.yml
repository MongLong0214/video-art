      - generic [ref=e396]:
        - generic [ref=e397]:
          - img [ref=e399]
          - generic [ref=e400]:
            - link "KiO" [ref=e401] [cursor=pointer]:
              - /url: /user/KiO
            - text: ", 2021-01-26"
            - text: Thanks iq! Sorry for necroing an article from 2011, but your resources are the most diverse and accessible, as well as extending into some very complex ideas, on the internet. It is a shame that raymarching, and shader-writing in general, seems to be a rather small niche of the programming world. It embodies the beauty of maths so well. A lot of your approaches integrate optimisation so heavily that I am struggling to read the logic in the code, as I am not that good at visualising mod functions yet. I can understand "iteratively subtract the cross" - I have made fractals before, but I do not understand how ... vec3 a = mod( p*s, 2.0 )-1.0; s *= 3.0; vec3 r = 1.0 - 3.0*abs(a); ... d = max(d,c); achieves the iterative subtraction of the crosses... I get why individual numbers are there - the 3 scales the cross as it gets smaller, the "1.0-" moves it into the middle of the next smaller grid. But if I try to derive these ideas from scratch myself my code does not produce what I want it to...
        - generic [ref=e402]:
