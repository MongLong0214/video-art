            - text: "@Fabrice Regarding why you'd bother raymarching this, as opposed to bump mapping, etc: It's an interesting question. A while back, I was trying to make a really pronounced looking bump map from a 2D pattern, then realized that with a few extra calls, I could raymarch it front-on and get all the extra benefits that go with 3D. In this case, I'm using 32 iterations just to be sure, but I'd imagine nowhere near all are needed. In fact, a lot of the times, I can get away with as few as 8, with the average function calls per pixel being fewer than that. Of course, I'm ignoring normal calculations and so forth, but it's still a very simple and cheap process, which makes it a worthwhile. In fact, I barely bother bump mapping 2D images at all anymore. Because of the way this is stylized, the 3D isn't as noticeable here, but it does subtly affect the way the light bounces around. My \"Bioorganic Wall\" shader is probably a better example. On a side note, this process would look pretty interesting applied to your \"escher-like 2\" shader, and a lot of your other ones."
